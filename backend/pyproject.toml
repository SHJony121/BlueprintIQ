[project]
name = "blueprintiq"
version = "0.1.0"
description = "Engineering drawing intelligence: extract measurements from PDF drawings and evaluate inspection rules with evidence."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blueprintiq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]
python_version = "3.12"

# PyMuPDF ships without type annotations. Only the three modules that form the
# PyMuPDF boundary may call its untyped functions; everything else stays strict.
[[tool.mypy.overrides]]
module = [
    "blueprintiq.ingestion.pdf_loader",
    "blueprintiq.extraction.text_layer",
    "blueprintiq.extraction.reader",
]
disallow_untyped_calls = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
